name: Release Allep

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create allep file
        uses: vimtor/action-zip@v1.1
        with:
          files: Library/ PythonPartsScripts/ PythonPartsActionbar/ install-config.yml
          recursive: false
          dest: FixturePlacement.allep

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"

          gh release create "$tag" `
            --title="$tag" `
            --draft `
            FixturePlacement.allep